[project]
name = "videostages-python-tests"
version = "0.0.0"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2,<3", "pytest>=8,<9", "torch>=2.5,<3"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
